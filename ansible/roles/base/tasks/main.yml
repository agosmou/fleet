---
# Sudo without a password for ag. On a server the only way in is the ssh
# key over the tailnet, so the password defends nothing and only makes
# every ansible run (and environment's bootstrap) stop to ask. Droplets
# are born this way (cloud-init); this converges the hand-built machines.
# The last `-K` run on such a machine is the one that writes this file.
- name: Passwordless sudo for ag
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ag
    content: "ag ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - ufw
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable periodic package list updates and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Configure unattended-upgrades reboot and cleanup policy
  ansible.builtin.template:
    src: 52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"

- name: Ensure unattended-upgrades is enabled
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

# Swap. Cloud images ship none, and a 1 GB droplet gets OOM-killed the
# first time nix copies a closure. A 2 GB file is the standard answer;
# machines that already have swap (spectre: a 4 GB installer partition)
# are left alone.
- name: Check for an existing swapfile
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile

- name: Create a 2 GB swapfile
  ansible.builtin.command: fallocate -l 2G /swapfile
  when:
    - not swapfile.stat.exists
    - ansible_facts['swaptotal_mb'] < 512

- name: Swapfile is root-only
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"
  when: swapfile.stat.exists or ansible_facts['swaptotal_mb'] < 512

- name: Format the swapfile
  ansible.builtin.command: mkswap /swapfile
  when:
    - not swapfile.stat.exists
    - ansible_facts['swaptotal_mb'] < 512

- name: Swapfile in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    regexp: '^/swapfile\s'
  when: swapfile.stat.exists or ansible_facts['swaptotal_mb'] < 512

- name: Swapfile active
  ansible.builtin.command: swapon /swapfile
  when:
    - ansible_facts['swaptotal_mb'] < 512
  changed_when: true
