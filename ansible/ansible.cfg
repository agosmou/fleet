[defaults]
# Every file in inventory/ is merged: 10-home.yml is hand-written,
# 20-vps.yml is written by terraform (terraform/digitalocean/main.tf).
inventory = inventory/
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
nocows = 1

[callback_default]
# Readable multi-line output (the old `stdout_callback = yaml` is gone).
result_format = yaml

[ssh_connection]
# Hosts are reached by their tailnet name, and a freshly born machine's
# host key is by definition unknown. accept-new trusts it on first contact
# and refuses any later change: the tailnet (WireGuard, authenticated
# peers only) is what makes that first contact safe.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s

[privilege_escalation]
become = True
become_method = sudo
