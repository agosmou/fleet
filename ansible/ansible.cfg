[defaults]
# Every file in inventory/ is merged: 10-home.yml is hand-written,
# 20-vps.yml is written by terraform (terraform/digitalocean/main.tf).
inventory = inventory/
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
# Run notified handlers even when a later task fails, so a written sshd
# drop-in is never left unloaded because ufw errored after it.
force_handlers = True
nocows = 1

[callback_default]
# Readable multi-line output (the old `stdout_callback = yaml` is gone).
result_format = yaml

[ssh_connection]
# Hosts are reached by their tailnet name, and a freshly born machine's
# host key is by definition unknown. accept-new trusts it on first contact
# and refuses any later change: the tailnet (WireGuard, authenticated
# peers only) is what makes that first contact safe. ControlPersist is
# short so the multiplexed connection never outlives the run visibly (it
# lingered once after a logind restart and looked like a hang).
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=5s

[privilege_escalation]
become = True
become_method = sudo
# Ubuntu 25.10+ makes sudo-rs the default `sudo`. It wraps a custom prompt
# as "[sudo: <prompt>] Password:", and ansible detects its prompt with
# startswith(), so become times out ("waiting for privilege escalation
# prompt"). Classic sudo is still installed as sudo.ws; use it. Drop this
# when ansible learns sudo-rs's prompt (ansible-core issue tracker: sudo-rs).
become_exe = sudo.ws
